<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamBro — BKN E-Learning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1a2d5a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    user-select: none;
    -webkit-user-select: none;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    animation: fadeIn 0.8s ease;
  }

  .logo-icon {
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.4);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    padding: 12px;
  }

  .logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .app-name {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  .app-sub {
    font-size: 0.95rem;
    opacity: 0.78;
    letter-spacing: 0.8px;
    text-align: center;
    line-height: 1.6;
  }

  .loading-bar-wrap {
    width: 260px;
    height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 1.6rem;
  }

  .loading-bar {
    height: 100%;
    background: linear-gradient(90deg, #60a5fa, #93c5fd, #60a5fa);
    background-size: 200% 100%;
    border-radius: 2px;
    animation: loading 1.6s ease-in-out infinite;
  }

  .loading-text {
    font-size: 0.82rem;
    opacity: 0.65;
    margin-top: 0.9rem;
    letter-spacing: 0.5px;
    animation: pulse 2s ease-in-out infinite;
  }

  .version-tag {
    position: fixed;
    bottom: 1.8rem;
    right: 2rem;
    font-size: 0.72rem;
    opacity: 0.4;
    letter-spacing: 0.5px;
  }

  .security-badge {
    position: fixed;
    bottom: 1.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 0.45rem 1.2rem;
    border-radius: 50px;
    font-size: 0.78rem;
    opacity: 0.75;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    display: inline-block;
    animation: blink 1.4s ease-in-out infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes loading {
    0%   { background-position: 200% 0; width: 25%; }
    50%  { background-position: 0% 0;   width: 75%; }
    100% { background-position: -200% 0; width: 25%; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.65; }
    50%       { opacity: 0.35; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">
      <img src="logo-sekolah.png" alt="Logo SMA BKN">
    </div>
    <div class="app-name">ExamBro</div>
    <div class="app-sub">
      Safe Browser — Mode Ujian<br>
      SMA Bina Kasih Nusantara
    </div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-text" id="loadText">Menghubungkan ke server...</div>
  </div>

  <div class="security-badge">
    <span class="dot"></span>
    Secure Browser — Sesi Ujian Aktif
  </div>

  <div class="version-tag">v1.0.5</div>

  <script>
    // Ganti teks loading setiap beberapa detik
    var msgs = [
      'Menghubungkan ke server...',
      'Menyiapkan sesi ujian...',
      'Memverifikasi akses...',
      'Memuat halaman ujian...',
    ];
    var i = 0;
    var el = document.getElementById('loadText');
    setInterval(function() {
      i = (i + 1) % msgs.length;
      el.style.opacity = '0';
      setTimeout(function() {
        el.textContent = msgs[i];
        el.style.opacity = '0.65';
      }, 300);
    }, 1800);
  </script>
</body>
</html>
